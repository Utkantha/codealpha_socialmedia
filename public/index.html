<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>instagram360</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Auth View -->
        <div id="auth-view" class="view auth-container">
            <div class="auth-box">
                <h1 class="logo">instagram360</h1>
                <div id="login-section">
                    <form id="login-form">
                        <input type="text" id="login-username" placeholder="Username" required>
                        <input type="password" id="login-password" placeholder="Password" required>
                        <button type="submit" class="btn-primary">Log In</button>
                    </form>
                    <div class="divider">OR</div>
                    <p>Don't have an account? <a href="#" id="show-register">Sign up</a></p>
                </div>
                <div id="register-section" style="display: none;">
                    <form id="register-form">
                        <input type="text" id="reg-username" placeholder="Username" required>
                        <input type="password" id="reg-password" placeholder="Password" required>
                        <button type="submit" class="btn-primary">Sign Up</button>
                    </form>
                    <p>Have an account? <a href="#" id="show-login">Log in</a></p>
                </div>
            </div>
        </div>

        <!-- Main View Layout (Sidebar + Content) -->
        <div id="main-view" class="view main-layout" style="display: none;">
            <!-- Left Sidebar Navigation -->
            <nav class="sidebar">
                <h1 class="logo sidebar-logo">instagram360</h1>
                <div class="nav-links">
                    <button class="nav-btn" data-target="feed"><i class="fas fa-home"></i> <span>Home</span></button>
                    <button class="nav-btn" data-target="search"><i class="fas fa-search"></i> <span>Search</span></button>
                    <button class="nav-btn" data-target="explore"><i class="far fa-compass"></i> <span>Explore</span></button>
                    <button class="nav-btn" data-target="reels"><i class="fas fa-film"></i> <span>Reels</span></button>
                    <button class="nav-btn" data-target="notifications"><i class="far fa-heart"></i> <span>Notifications</span></button>
                    <button class="nav-btn" id="nav-create"><i class="far fa-plus-square"></i> <span>Create</span></button>
                    <button class="nav-btn" data-target="profile"><i class="far fa-user"></i> <span>Profile</span></button>
                </div>
                <div class="nav-footer">
                    <button id="logout-btn" class="nav-btn"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></button>
                </div>
            </nav>
            
            <main id="content" class="content-area">
                <!-- Create Post Modal -->
                <div id="create-post-modal" class="modal" style="display: none;">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h3>Create new post</h3>
                            <button class="close-modal">&times;</button>
                        </div>
                        <form id="post-form">
                            <input type="file" id="post-media" accept="image/*,video/*" style="margin-bottom: 10px;" required>
                            <label style="margin-bottom: 10px;"><input type="checkbox" id="post-is-reel"> Post as Reel (Video only)</label>
                            <textarea id="post-content" placeholder="Write a caption..." required></textarea>
                            <button type="submit" class="btn-primary">Share</button>
                        </form>
                    </div>
                </div>
                
                <!-- Feed Section -->
                <div id="feed-section" class="view-section">
                    <div class="stories-bar">
                        <!-- Fake stories for UI -->
                        <div class="story"><div class="story-ring"><i class="fas fa-user-circle"></i></div><span>john_doe</span></div>
                        <div class="story"><div class="story-ring"><i class="fas fa-user-circle"></i></div><span>jane_smith</span></div>
                        <div class="story"><div class="story-ring"><i class="fas fa-user-circle"></i></div><span>insta_360_user</span></div>
                        <div class="story"><div class="story-ring"><i class="fas fa-user-circle"></i></div><span>react_fan</span></div>
                    </div>
                    <div id="posts-container" class="feed"></div>
                </div>

                <!-- Search Section -->
                <div id="search-section" class="view-section" style="display: none;">
                    <div class="search-header">
                        <h2>Search</h2>
                        <input type="text" id="search-input" placeholder="Search users...">
                    </div>
                    <div id="search-results"></div>
                </div>

                <!-- Explore Section -->
                <div id="explore-section" class="view-section" style="display: none;">
                    <div id="explore-grid" class="profile-grid"></div>
                </div>

                <!-- Reels Section -->
                <div id="reels-section" class="view-section reels-view-wrapper" style="display: none;">
                    <div id="reels-container" class="reels-scroll-container"></div>
                </div>

                <!-- Notifications Section -->
                <div id="notifications-section" class="view-section notification-wrapper" style="display: none;">
                    <h2>Notifications</h2>
                    <div id="notifications-list"></div>
                </div>

                <!-- Profile Section -->
                <div id="profile-section" class="view-section" style="display: none;">
                    <div class="profile-header">
                        <div class="profile-avatar-large">
                            <i class="fas fa-user-circle"></i>
                        </div>
                        <div class="profile-info">
                            <div class="profile-title">
                                <h2 id="profile-username"></h2>
                                <div id="profile-actions"></div>
                            </div>
                            <div class="profile-stats">
                                <span><strong id="profile-post-count">0</strong> posts</span>
                                <span><strong id="profile-followers-count">0</strong> followers</span>
                                <span><strong id="profile-following-count">0</strong> following</span>
                            </div>
                            <p id="profile-bio" class="bio"></p>
                            <form id="edit-bio-form" style="display:none;">
                                <input type="text" id="bio-input" placeholder="Update your bio...">
                                <button type="submit" class="btn-secondary">Save</button>
                            </form>
                        </div>
                    </div>
                    
                    <div class="profile-tabs">
                        <div class="tab active"><i class="fas fa-th"></i> POSTS</div>
                    </div>
                    
                    <div id="user-posts-container" class="profile-grid"></div>
                </div>
            </main>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
